<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1C10" />
      <stop offset="100%" stop-color="#1C0A04" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4A261" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1C0A04" stop-opacity="0" />
    </radialGradient>
    <pattern id="mandalaPat" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#F4A261" opacity="0.25" />
      <path d="M 0 20 Q 20 0 40 20 Q 20 40 0 20" fill="none" stroke="#F4A261" stroke-width="0.75" opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#mandalaPat)" />
  <circle cx="400" cy="230" r="220" fill="url(#glow)" />

  <!-- Center Decorative Plate -->
  <g transform="translate(400, 220)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="140" fill="#1A1816" opacity="0.4" />
    <circle cx="0" cy="0" r="130" fill="#2D241E" stroke="#F4A261" stroke-width="3" stroke-dasharray="8 4" />
    <!-- Brass / Terracotta Platter -->
    <circle cx="0" cy="0" r="115" fill="#42281D" stroke="#D4A373" stroke-width="2" />
    <circle cx="0" cy="0" r="105" fill="#583424" />

    <!-- Food Emoji Center Icon -->
    <text x="0" y="25" font-size="80" text-anchor="middle" dominant-baseline="middle">🍲</text>
  </g>

  <!-- Cultural Heritage Label Box -->
  <rect x="50" y="380" width="700" height="85" rx="18" fill="#181513" fill-opacity="0.85" stroke="#F4A261" stroke-width="1.5" />
  
  <text x="75" y="418" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#FFFFFF" letter-spacing="0.5">
    Bisi Bele Bath
  </text>
  <text x="75" y="445" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4A261" letter-spacing="1">
    ROYAL MYSORE PALACE SPICED LENTIL RICE • KARNATAKA
  </text>

  <!-- Authenticity Stamp Badge -->
  <g transform="translate(700, 422)">
    <circle cx="0" cy="0" r="22" fill="#F4A261" fill-opacity="0.2" stroke="#F4A261" stroke-width="1.5" />
    <text x="0" y="4" font-size="16" text-anchor="middle" dominant-baseline="middle">🇮🇳</text>
  </g>
</svg>